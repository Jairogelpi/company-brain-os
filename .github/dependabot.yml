version: 2
updates:
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      radix-ui:
        patterns:
          - "@radix-ui/*"
      testing-toolchain:
        patterns:
          - "vitest"
          - "@vitest/*"
          - "testcontainers"
          - "@testcontainers/*"
      aws-sdk:
        patterns:
          - "@aws-sdk/*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns:
          - "*"
