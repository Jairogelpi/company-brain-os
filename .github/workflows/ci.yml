name: Company Brain OS CI

on:
  push:
    branches: [main, master, "feat/**", "hardening/**"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Absolute release gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: company_brain_os
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Clean deterministic install
        run: npm ci

      - name: Repository lint
        run: npm run lint

      - name: Format policy check
        run: npm run format:check

      - name: Canonical documentation audit
        run: npm run docs:audit

      - name: Run production migrations
        run: npm run db:migrate
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/company_brain_os

      - name: Seed test tenant explicitly
        run: npm run db:seed
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/company_brain_os
          SEED_PASSWORD: ci-test-password

      - name: Full test suite
        run: npm test -- --run
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/company_brain_os

      - name: Canonical Pedro / Laura E2E
        run: npm run test:e2e

      - name: Critical domain coverage gate
        run: npm run test:critical

      - name: PostgreSQL tenant isolation gate
        run: npx vitest --config test.integration.config.ts run
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/company_brain_os

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build
        env:
          AUTH_SECRET: build-time-placeholder-secret-not-used-at-runtime

      - name: Dependency vulnerability gate
        run: npm audit --omit=dev --audit-level=high

  browser:
    name: Browser E2E (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: company_brain_os
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Clean deterministic install
        run: npm ci

      - name: Migrate browser-test database
        run: npm run db:migrate
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/company_brain_os

      - name: Seed browser-test owner
        run: npm run db:seed
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/company_brain_os
          SEED_PASSWORD: ci-test-password

      - name: Typecheck browser harness
        run: npm run typecheck:browser

      - name: Install pinned Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser journeys
        run: npm run test:browser
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/company_brain_os
          AUTH_SECRET: browser-e2e-secret
          AUTH_TRUST_HOST: "true"
          SEED_PASSWORD: ci-test-password
          E2E_PASSWORD: ci-test-password
