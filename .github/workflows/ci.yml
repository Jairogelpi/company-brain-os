name: Company Brain OS CI

on:
  push:
    branches: [main, master, "feat/**", "hardening/**"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  remediate-dependencies:
    name: One-shot dependency remediation
    if: github.event_name == 'pull_request' && github.head_ref == 'hardening/absolute-10' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v7
        with:
          ref: hardening/absolute-10

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install exact current graph
        run: npm ci

      - name: Upgrade vulnerable production framework/auth dependencies
        run: npm install --save-exact next@16.3.2 next-auth@5.0.0-beta.32

      - name: Require clean production audit
        run: npm audit --omit=dev --audit-level=high

      - name: Regression suite
        run: npm test -- --run

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          AUTH_SECRET: build-time-placeholder-secret-not-used-at-runtime

      - name: Commit generated dependency graph
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency graph changes generated"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "fix(deps): remediate production vulnerabilities"
          git push origin HEAD:hardening/absolute-10

  test:
    name: Absolute release gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: company_brain_os
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Clean deterministic install
        run: npm ci

      - name: Run production migrations
        run: npm run db:migrate
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/company_brain_os

      - name: Seed test tenant explicitly
        run: npm run db:seed
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/company_brain_os
          SEED_PASSWORD: ci-test-password

      - name: Full test suite
        run: npm test -- --run
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/company_brain_os

      - name: Canonical Pedro / Laura E2E
        run: npm run test:e2e

      - name: Critical domain coverage gate
        run: npm run test:critical

      - name: PostgreSQL tenant isolation gate
        run: npx vitest --config test.integration.config.ts run
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/company_brain_os

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build
        env:
          AUTH_SECRET: build-time-placeholder-secret-not-used-at-runtime

      - name: Dependency vulnerability gate
        run: npm audit --omit=dev --audit-level=high
